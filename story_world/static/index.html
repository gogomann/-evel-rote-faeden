<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evel • Rote Fäden</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-icon-192x192.png">
<link rel="apple-touch-icon" sizes="57x57" href="/favicon/apple-touch-icon-57x57.png">
<link rel="apple-touch-icon" sizes="60x60" href="/favicon/apple-touch-icon-60x60.png">
<link rel="apple-touch-icon" sizes="72x72" href="/favicon/apple-touch-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="/favicon/apple-touch-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="/favicon/apple-touch-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="/favicon/apple-touch-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="/favicon/apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon-180x180.png">
<meta name="msapplication-square70x70logo" content="/favicon/mstile-70x70.png">
<meta name="msapplication-square150x150logo" content="/favicon/mstile-150x150.png">
<meta name="msapplication-square310x310logo" content="/favicon/mstile-310x310.png">
</head>
<body>
<header class="top">
  <div class="brand"><img class="logo" src="/evel-icon.svg" alt=""><span>Evel<span class="dot"> • </span>Rote Fäden</span><small>Lokale Werkstatt</small></div>
  <div class="world-pick">
    <select id="world-select" aria-label="Welt wählen"></select>
    <button class="ghost" id="btn-new-world">+ Neue Welt</button>
  </div>
  <div class="top-right">
    <span id="jobs-indicator" class="jobs hidden"></span>
    <button id="btn-expert" class="reveal" title="Experte: alle Regler und Messwerte zeigen">🎛 Einfach</button>
    <button id="btn-user" class="reveal" title="Wer bedient gerade?">👤</button>
    <button id="btn-reveal" class="reveal" title="Backstage-Inhalte anzeigen">🔒 Spoilerschutz an</button>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-view="uebersicht" class="active">Übersicht</button>
  <button data-view="geschichten">Geschichten</button>
  <button data-view="stil">Schreibstil</button>
  <button data-view="folgen">Folgen</button>
  <button data-view="impulse">Impulse</button>
  <button data-view="vorschlaege">Vorschläge <span class="badge hidden" id="badge-proposals"></span></button>
  <button data-view="laeufe">KI-Läufe <span class="badge hidden" id="badge-runs"></span></button>
  <button data-view="welt">Welt</button>
  <button data-view="luecken">Prüfung <span class="badge hidden" id="badge-gaps"></span></button>
  <button data-view="zeit">Zeit &amp; Reisen</button>
  <button data-view="protokoll">Protokoll</button>
  <button data-view="projekt">Projektstatus</button>
  <button data-view="einstellungen">Einstellungen</button>
</nav>
<div id="update-banner" class="update-banner hidden" aria-live="polite"></div>
<main id="view"></main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
